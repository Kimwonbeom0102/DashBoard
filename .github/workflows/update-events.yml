name: Update GitHub Events

on:
  push:
    branches: [main]
    paths-ignore:
      - 'github-events.json'   # 데이터 파일 변경으로 인한 무한 루프 방지
  schedule:
    - cron: '15 * * * *'       # 매시간 15분
  workflow_dispatch:           # GitHub 웹에서 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 파일 커밋에 필요

    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub events
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/Kimwonbeom0102/events?per_page=10" \
            -o github-events.json
          echo "Fetched $(cat github-events.json | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))') events"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-events.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "chore: sync github events [skip ci]" && git push
