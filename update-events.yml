name: Update GitHub Commits

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  update-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch commits from all repos
        run: |
          python3 << 'EOF'
          import json, urllib.request

          TOKEN = "${{ secrets.PAT_TOKEN }}"
          USERNAME = "Kimwonbeom0102"
          HEADERS = {
              "Authorization": f"token {TOKEN}",
              "Accept": "application/vnd.github.v3+json",
              "User-Agent": "GitHub-Actions"
          }

          def fetch(url):
              try:
                  req = urllib.request.Request(url, headers=HEADERS)
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f"Error fetching {url}: {e}")
                  return []

          # 내 모든 저장소 목록
          repos = fetch("https://api.github.com/user/repos?per_page=100&type=owner")
          print(f"저장소 수: {len(repos)}")

          all_events = []
          for repo in repos:
              full_name = repo["full_name"]
              commits = fetch(f"https://api.github.com/repos/{full_name}/commits?per_page=1&author={USERNAME}")
              for c in commits:
                  try:
                      all_events.append({
                          "id": c["sha"],
                          "type": "PushEvent",
                          "repo": {
                              "name": full_name,
                              "url": f"https://github.com/{full_name}"
                          },
                          "payload": {
                              "commits": [{
                                  "sha": c["sha"][:7],
                                  "message": c["commit"]["message"].split("\n")[0]
                              }]
                          },
                          "created_at": c["commit"]["author"]["date"],
                          "actor": {"login": USERNAME}
                      })
                  except Exception as e:
                      print(f"Error parsing commit: {e}")
                      continue

          # 날짜순 정렬, 최신 20개
          all_events.sort(key=lambda x: x["created_at"], reverse=True)

          with open("github-events.json", "w", encoding="utf-8") as f:
              json.dump(all_events, f, indent=2, ensure_ascii=False)

          print(f"총 {len(all_events)}개 커밋 저장 완료")
          EOF

            - name: Commit changes
        run: |
          echo "=== 현재 파일 내용 (앞 3줄) ==="
          head -3 github-events.json
          echo "=== Git status ==="
          git status
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-events.json
          echo "=== Staged diff ==="
          git diff --staged --stat
          git commit -m "chore: update github commits [skip ci]" || echo "커밋할 내용 없음"
          git push || echo "푸시할 내용 없음"
