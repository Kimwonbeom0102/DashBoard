name: Update GitHub Commits

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  update-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest commit per repo
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import json, urllib.request, os

          TOKEN = os.environ["PAT_TOKEN"]
          USERNAME = "Kimwonbeom0102"
          HEADERS = {
              "Authorization": f"token {TOKEN}",
              "Accept": "application/vnd.github.v3+json",
              "User-Agent": "GitHub-Actions"
          }

          def fetch(url):
              try:
                  req = urllib.request.Request(url, headers=HEADERS)
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read())
              except Exception as e:
                  print(f"Error fetching {url}: {e}")
                  return []

          repos = fetch("https://api.github.com/user/repos?per_page=100&type=owner")
          print(f"저장소 수: {len(repos)}")

          all_events = []
          for repo in repos:
              full_name = repo["full_name"]
              commits = fetch(f"https://api.github.com/repos/{full_name}/commits?per_page=1")
              for c in commits:
                  try:
                      all_events.append({
                          "id": c["sha"],
                          "type": "PushEvent",
                          "repo": {"name": full_name, "url": f"https://github.com/{full_name}"},
                          "payload": {"commits": [{"sha": c["sha"][:7], "message": c["commit"]["message"].split("\n")[0]}]},
                          "created_at": c["commit"]["author"]["date"],
                          "actor": {"login": USERNAME}
                      })
                  except Exception as e:
                      print(f"Parse error: {e}")

          all_events.sort(key=lambda x: x["created_at"], reverse=True)

          with open("github-events.json", "w", encoding="utf-8") as f:
              json.dump(all_events, f, indent=2, ensure_ascii=False)

          print(f"총 {len(all_events)}개 레포 저장 완료")
          PYEOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-events.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: update github commits [skip ci]"
            git push
          fi
